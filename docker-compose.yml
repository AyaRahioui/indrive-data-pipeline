name: indrive_light

services:
  postgres:
    image: postgres:16
    container_name: indrive-postgres
    environment:
      POSTGRES_DB: indrive
      POSTGRES_USER: indrive
      POSTGRES_PASSWORD: indrive
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql   # creates raw / staging / mart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indrive -d indrive"]
      interval: 3s
      retries: 20

  adminer:
    image: adminer
    container_name: indrive-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]
    ports:
      - "8085:8080"        # http://localhost:8085

  airflow:
    image: apache/airflow:2.9.3
    container_name: indrive-airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"                # hide Airflow demo DAGs
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"   # our DAGs start by themselves
      PG_HOST: postgres        # how the DAGs connect to the database
      PG_DB: indrive
      PG_USER: indrive
      PG_PASSWORD: indrive
      MOCKAROO_KEY: ${MOCKAROO_KEY:-}
      VERIFY_SSL: "true"       # set to "false" if your network blocks HTTPS (see README)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
    ports:
      - "8081:8080"        # http://localhost:8081